# Backup keep-alive for a deployed PING instance.
#
# Primary: point a dedicated scheduler (cron-job.org, UptimeRobot, a small VPS)
# at /api/cron/tick every 5-10 minutes. GitHub's scheduled workflows are
# best-effort and can be delayed by hours; this workflow is the backup, not the
# thing that keeps PING reliably awake.
#
# Setup:
#   1. Deploy PING (see render.yaml).
#   2. Add a repository secret named PING_URL with the deployment origin,
#      e.g. https://ping-xxxx.onrender.com   (no trailing slash, no /api path).
#   3. Add a repository secret named PING_TOKEN with the CRON_SECRET value
#      Render generated for the service (Dashboard → Environment).
#
# Every run hits PING's /api/cron/tick endpoint, which:
#   - counts as inbound traffic (waking a spun-down Render instance), and
#   - runs every monitor whose check interval has elapsed.
#
# The token is sent as the x-cron-token header so it stays out of the URL.
# A missing secret fails the run instead of reporting a green no-op.
name: PING keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay this)
  workflow_dispatch: # manual "Run workflow" button

permissions: {}

concurrency:
  group: ping-keep-alive
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          PING_URL: ${{ secrets.PING_URL }}
          PING_TOKEN: ${{ secrets.PING_TOKEN }}
        run: |
          missing=0
          if [ -z "$PING_URL" ]; then
            echo "::error::Repository secret PING_URL is not set (see this file's header)."
            missing=1
          fi
          if [ -z "$PING_TOKEN" ]; then
            echo "::error::Repository secret PING_TOKEN is not set (see this file's header)."
            missing=1
          fi
          exit "$missing"
      - name: Tick PING (runs all due checks)
        env:
          PING_URL: ${{ secrets.PING_URL }}
          PING_TOKEN: ${{ secrets.PING_TOKEN }}
        run: |
          # Retry through a Render cold start (502/503) instead of burning the
          # one run. A wrong token also retries; its error is still surfaced.
          curl -fsS --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            -H "x-cron-token: $PING_TOKEN" \
            "$PING_URL/api/cron/tick"
