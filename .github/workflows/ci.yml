name: PING CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      # Type-check + production build (next build fails on type errors, since
      # next.config.ts sets ignoreBuildErrors: false).
      - run: bun run build
      - run: bun test
