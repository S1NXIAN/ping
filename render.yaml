# Deploy PING on Render — free tier.
#
# What "free" means here (honest notes):
# - The instance spins down after ~15 min without traffic. PING pairs with the
#   keep-alive GitHub workflow in this repo (.github/workflows/keep-alive.yml)
#   to stay awake. Without it, checks pause while the instance sleeps.
# - No persistent disk on free: the SQLite file lives at /tmp/ping.db (always
#   writable, no mkdir needed) on the instance's ephemeral filesystem and
#   RESETS on every deploy and every spin-down.
#   Back up via Settings → "Export monitors". For durable data, upgrade the
#   plan and re-add the disk block below (commented for reference).
# - Free instance hours are pooled per workspace (~750/month).
#
# Render Blueprint docs: https://render.com/docs/blueprints
services:
  - type: web
    name: ping
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # /tmp is world-writable on Render's native runtime; /var/data only exists
    # when a persistent disk is attached (paid plans) — mkdir fails on free.
    startCommand: npx prisma db push --accept-data-loss && node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # /tmp → same ephemeral file for `db push` and runtime; no mkdir needed
        value: file:/tmp/ping.db
      - key: NODE_ENV
        value: production
      # Optional: require ?token=<secret> on /api/cron/tick (keep-alive)
      # - key: CRON_SECRET
      #   generateValue: true
    # Paid plan only — re-enable for durable SQLite storage:
    # disk:
    #   name: ping-data
    #   mountPath: /var/data
    #   sizeGB: 1
