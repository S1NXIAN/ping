# Deploy PING on Render — free tier.
#
# What "free" means here (honest notes):
# - The instance spins down after ~15 min without traffic. PING pairs with the
#   keep-alive GitHub workflow in this repo (.github/workflows/keep-alive.yml)
#   to stay awake. Without it, checks pause while the instance sleeps.
# - No persistent disk on free: the SQLite file lives on the instance's
#   ephemeral filesystem and RESETS on every deploy and every spin-down.
#   Back up via Settings → "Export monitors". For durable data, upgrade the
#   plan and re-add the disk block below (commented for reference).
# - Free instance hours are pooled per workspace (~750/month).
#
# Render Blueprint docs: https://render.com/docs/blueprints
services:
  - type: web
    name: ping
    runtime: node
    plan: free
    region: singapore
    branch: dev
    autoDeploy: true
    buildCommand: bun install && bunx prisma generate && bun run build
    # free has no disk: /tmp is always writable but ephemeral (resets on deploy/sleep)
    startCommand: bunx prisma db push --accept-data-loss && bun .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # /tmp → writable without a disk; same file for `db push` and runtime
        value: file:/tmp/ping.db
      - key: NODE_ENV
        value: production
      # Optional: require ?token=<secret> on /api/cron/tick (keep-alive)
      # - key: CRON_SECRET
      #   generateValue: true
    # Paid plan only — re-enable for durable SQLite storage:
    # disk:
    #   name: ping-data
    #   mountPath: /var/data
    #   sizeGB: 1
