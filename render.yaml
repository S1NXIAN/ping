# Deploy PING on Render — free tier.
#
# What "free" means here (honest notes):
# - The instance spins down after ~15 min without traffic. Once booted, PING's
#   Self-monitor keeps it awake; a spun-down instance needs an external tick.
#   Use a dedicated scheduler (cron-job.org / UptimeRobot — see README).
# - No persistent disk on free: the SQLite file lives on the instance's
#   ephemeral filesystem and RESETS on every deploy, restart, and spin-down.
#   buildFilter below keeps docs/tests/CI-only commits from deploying; a
#   runtime change still resets the DB. Back up via Settings → "Export monitors".
# - Free instance hours are pooled per workspace (~750/month).
#
# Render Blueprint docs: https://render.com/docs/blueprints
services:
  - type: web
    name: ping
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Docs, tests, and CI changes don't affect the running app. Without this
    # filter any push to main redeploys the service and wipes the SQLite file.
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
        - docs/**
        - .github/**
        - tests/**
    buildCommand: bun install && bunx prisma generate && bun run build
    # /tmp = only writable path on free (no disk). Ephemeral: resets on deploy/spin-down.
    startCommand: bunx prisma db push --accept-data-loss && bun .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/tmp/ping.db
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: BUN_VERSION
        value: 1.4.2
      # Require a token on /api/cron/tick so a stranger who finds the URL
      # cannot make PING fetch every monitor (including LAN/localhost targets).
      # Render generates the value; give it to the external scheduler (see README).
      - key: CRON_SECRET
        generateValue: true
